<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 할 일 목록</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="card">
    <h1 class="title">나의 할 일 목록</h1>

    <!-- 할 일 입력 영역 -->
    <form id="todo-form" class="todo-form">
      <input id="todo-input" class="todo-input" type="text" placeholder="할 일을 입력하세요" aria-label="할 일" autocomplete="off">
      <button class="btn" type="submit">추가</button>
    </form>

    <!-- 필터 버튼 (전체 / 진행중 / 완료) -->
    <div class="filters" role="group" aria-label="할 일 필터">
      <button class="filter-btn active" type="button" data-filter="all" aria-pressed="true">전체</button>
      <button class="filter-btn" type="button" data-filter="active" aria-pressed="false">진행중</button>
      <button class="filter-btn" type="button" data-filter="completed" aria-pressed="false">완료</button>
    </div>

    <!-- 할 일 개수 표시 + 완료 항목 일괄 삭제 -->
    <div class="toolbar">
      <p id="todo-count" class="todo-count" aria-live="polite">전체 0개 · 완료 0개</p>
      <button id="clear-completed" class="clear-btn" type="button" disabled>완료된 항목 삭제</button>
    </div>

    <!-- 할 일 목록 영역 (비었을 때 안내 문구는 data-empty 값을 표시) -->
    <ul id="todo-list" class="todo-list" data-empty="아직 할 일이 없어요. 위에서 추가해 보세요!"></ul>
  </main>
</body>
</html>
